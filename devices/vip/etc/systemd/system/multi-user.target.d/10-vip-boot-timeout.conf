# The pedal root only. A boot that hasn't reached multi-user.target in five minutes is stuck: a unit
# that hangs with no timeout of its own, a mount that never comes. PID 1 still feeds the watchdog,
# so nothing else would reboot it. Reboot, so the initramfs counts the boot and vip-guard sends
# vip to rescue after GUARD_LIMIT of them. A normal boot reaches it in under 20 s.
[Unit]
JobTimeoutSec=300
JobTimeoutAction=reboot
