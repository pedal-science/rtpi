# The pedal root only. Emergency mode waits for a root password, and vip has none, so a pedal
# that lands here (a bad fstab entry, a failed mount, a broken unit) would sit unreachable with
# its watchdog fed until someone pulled the power. Reboot instead: the initramfs counts the boot,
# and after GUARD_LIMIT of them vip-guard makes rescue the default. The console says why first.
[Service]
ExecStart=
ExecStart=-/bin/sh -c 'echo "vip: the pedal root failed to boot (emergency mode): rebooting in 10 s; after GUARD_LIMIT such boots, rescue" > /dev/console; sleep 10; exec /usr/bin/systemctl --force reboot'
