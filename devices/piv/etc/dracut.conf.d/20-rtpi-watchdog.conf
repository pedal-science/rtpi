# Arm the watchdog inside the initramfs too.
#
# The cmdline settings (rd.shell=0 rd.emergency=reboot rd.retry=60 rd.timeout=90) cover
# the "root device never appears" path. They do NOT cover a dracut hook itself wedging.
# bcm2835_wdt is built in (confirmed in modules.builtin), so /dev/watchdog0 exists in the
# initramfs and systemd-in-initrd can pet it.
install_items+=" /etc/systemd/system.conf.d/10-rtpi-watchdog.conf "
