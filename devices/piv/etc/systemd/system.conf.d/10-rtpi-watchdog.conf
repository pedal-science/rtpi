# Arm the BCM2835 hardware watchdog so a wedged kernel resets itself.
#
# Why: without this, RuntimeWatchdogSec=0 and a hang after boot stops dead, needing a
# manual power cycle — which we cannot do remotely (no smart plug). With it armed, a
# hang triggers a hardware reset; because the Pi's tryboot flag is one-shot and already
# consumed, that reset lands on the known-good kernel, and piboot-try-reboot then marks
# the candidate bad. That is what makes the fallback fully automatic.
#
# The BCM2835 watchdog hardware maximum is 15s (drivers/watchdog/bcm2835_wdt.c), so 14s
# is the largest safe setting. systemd asks the driver for the timeout and the driver
# clamps, but staying under the max keeps the behaviour predictable.
#
# CAUTION: during long deliberate stress runs (stress-ng, rteval, hackbench) a heavily
# loaded box can in principle miss a ping. Use `make watchdog-off-piv` around benchmark
# runs if you see spurious resets, and turn it back on afterwards.
[Manager]
RuntimeWatchdogSec=14
RebootWatchdogSec=2min
KExecWatchdogSec=0
