# piboot-try-validate.service inherits DefaultTimeoutStartSec=90s. Our validate hook
# waits up to 30s for sshd and 45s for a network address, so on a slow boot it can be
# KILLED mid-run — which systemd treats as a failure, marking a good kernel bad and
# rolling it back. Give it room.
[Service]
TimeoutStartSec=300
