# piv — runtime audio tuning. Read by /usr/local/sbin/rtpi-audio-tune.
#
# This file is the ONLY place the CPU split is declared. It has to agree with the
# isolcpus/nohz_full/rcu_nocbs arguments on the kernel command line, which are set from
# AUDIO_TUNING_ARGS in devices/piv/device.env. If you change one, change the other --
# rtpi-audio-tune checks them against each other at boot and complains if they disagree.

# Cores reserved for audio. Nothing else is scheduled here once isolcpus is in force.
ISOLATED_CPUS="2-3"

# Cores that carry interrupts, kernel threads, and everything else.
HOUSEKEEPING_CPUS="0-1"

# The audio interrupt, matched by NAME rather than number.
#
# IRQ numbers on this board are not stable: they are allocated in probe order under
# rp1_irq_chip, so a kernel that enumerates devices in a different order renumbers them.
# Pinning "IRQ 138" would therefore silently pin some unrelated device after a kernel
# change -- and it would still look like it had worked. The name is stable.
#
# On piv this is the xHCI controller the SSL 2+ is attached to. Since 2026-09-25 that is
# the one named usb4 (through a hub), and root storage is a UAS device on the other one
# (xhci-hcd:usb2), so audio and disk still do not share an interrupt line. Until then it
# was the other way round. rtpi-audio-tune finds the controller from the interface's USB
# id and warns when it differs from this name. Confirm with: grep xhci /proc/interrupts
AUDIO_IRQ_NAME="xhci-hcd:usb4"

# Which isolated core the audio interrupt thread is pinned to.
AUDIO_IRQ_CPU="2"

# SCHED_FIFO priority for that interrupt thread. Other threaded IRQs sit at 50 by default
# under PREEMPT_RT. Raising only the audio one means a burst on any other device cannot
# preempt delivery of audio data.
#
# Keep this ABOVE the other IRQ threads and ABOVE the JACK/PipeWire RT threads, which
# conventionally run in the 70s: the interrupt that delivers the samples has to win
# against the thread that is waiting for them, or the thread wakes up to no data.
AUDIO_IRQ_PRIO="85"
