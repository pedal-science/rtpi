# rtpi's additions to pro's GRUB configuration. A drop-in, so /etc/default/grub stays the
# installer's and `grub-mkconfig` reads this after it.
#
# These four lines are what make the pedal's boot entries safe to add. Without the first two, simply
# INSTALLING the realtime kernel would change what pro boots: 10_linux writes its "Ubuntu" entry for
# the newest kernel it finds, and GRUB_DEFAULT=0 points at that entry — so the new kernel would
# become the default with no isolation arguments, no trial and no validation. That is the single
# most likely way to get this wrong, and it is a one-line fix.

# What boots is a named entry recorded in grubenv, not a position in the menu. `pro-boot default`
# and the promotion step write it; positions move whenever a kernel is installed or removed.
GRUB_DEFAULT=saved

# Ubuntu's own "Ubuntu" entry stays the STOCK kernel, whatever newer kernels are installed beside
# it. That entry is pro's fallback: it is what a failed trial comes back to and what
# `pro-boot default stock` returns to, so it must not quietly become the realtime kernel.
#
# Read from device.env rather than written here, so the release lives in one place. These files are
# sourced as shell by grub-mkconfig, which is why this works.
GRUB_TOP_LEVEL="/boot/vmlinuz-$(sed -n 's/^STOCK_KERNEL=//p' /etc/rtpi/device.env | tr -d '"' | tail -1)"

# A failed boot shows the menu for this long. The default is 30 seconds, which on a headless
# machine is 30 seconds of nothing before it boots the default anyway.
GRUB_RECORDFAIL_TIMEOUT=5

# Nothing else is installed on this disk, and os-prober mounts every filesystem it can find to look
# — including, if one is attached, the pedal's own card.
GRUB_DISABLE_OS_PROBER=true
