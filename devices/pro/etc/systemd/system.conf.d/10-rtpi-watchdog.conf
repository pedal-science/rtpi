# Arm the chipset watchdog so a wedged kernel resets itself.
#
# NOT installed by default on pro: scripts/deploy/harden-pro.sh --watchdog opts in, and
# devices/pro/device.env (WATCHDOG=off) says why the default differs from vip's. In short: vip is
# unreachable without one, pro is on the bench with "After Power Loss: Previous State" in its BIOS,
# Ubuntu blacklists every watchdog module here, and a watchdog that fires during a deliberate
# hour-long soak destroys the measurement it fired during.
#
# 60 s, not vip's 14. vip is pressed against the BCM2835's 15 s hardware maximum; nothing here is,
# and a long timeout is what makes a spurious reset under heavy load implausible. systemd pings at
# half the timeout, so every 30 s.
#
# The driver has to be loaded by name (etc/modules-load.d/10-rtpi-watchdog.conf beside this):
# /lib/modprobe.d/blacklist_linux_*.conf blacklists iTCO_wdt, which stops it loading by alias but
# not by name.
#
# CAUTION, the same one rtpi gives for vip: turn it off around long stress runs if you ever see a
# spurious reset, and turn it back on afterwards.
[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=2min
KExecWatchdogSec=0
