# On a TRIAL boot only: reboot instead of waiting for a root password.
#
# Emergency mode asks for the root password, and pro's root has none, so a trial that lands here (a
# bad kernel argument, a failed mount, a unit that will not start) would sit unreachable until
# somebody walked over to it — with the untested kernel still the one that just ran. Rebooting
# instead lands on the saved default, because GRUB's one-shot was spent on the trial, and
# `pro-boot settle` then marks the trial bad.
#
# ConditionKernelCommandLine is what keeps this to trials: on a normal boot, emergency mode behaves
# exactly as Ubuntu intends, because then it is a machine to debug rather than a test to abandon.
[Unit]
ConditionKernelCommandLine=pedalboot.profile=trial

[Service]
ExecStart=
ExecStart=-/bin/sh -c 'echo "pro: the trial kernel failed to boot (emergency mode): rebooting in 10 s to the known-good default" > /dev/console; sleep 10; exec /usr/bin/systemctl --force reboot'
