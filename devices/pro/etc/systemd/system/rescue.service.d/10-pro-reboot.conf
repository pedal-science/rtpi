# On a TRIAL boot only: reboot instead of waiting for a root password. The reasoning is the
# emergency drop-in's, beside this one; rescue mode (systemd.unit=rescue.target) asks for the same
# password and waits just as long.
[Unit]
ConditionKernelCommandLine=pedalboot.profile=trial

[Service]
ExecStart=
ExecStart=-/bin/sh -c 'echo "pro: the trial kernel failed to boot (rescue mode): rebooting in 10 s to the known-good default" > /dev/console; sleep 10; exec /usr/bin/systemctl --force reboot'
