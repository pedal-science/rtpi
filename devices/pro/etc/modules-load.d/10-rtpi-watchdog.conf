# The chipset watchdog, loaded by name because Ubuntu blacklists it.
#
# /lib/modprobe.d/blacklist_linux_<release>.conf lists iTCO_wdt (and wdat_wdt) among every other
# watchdog driver. A blacklist only stops automatic loading by alias; modules-load.d asks for it
# explicitly, which still works.
#
# Installed only with scripts/deploy/harden-pro.sh --watchdog, together with the systemd drop-in
# that arms it. Without both, /dev/watchdog0 does not exist and systemd's RuntimeWatchdogSec has
# nothing to pet.
iTCO_wdt
